<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculus AI Tutor - Rock-a-Rhythm Free Edition</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --panel-bg: rgba(255, 255, 255, 0.96);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #eeeffe;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.8rem 2rem;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.25rem; }
    .brand i { color: #818cf8; }

    .container { display: flex; flex: 1; padding: 1.5rem; gap: 1.5rem; overflow: hidden; }

    /* Quiz Section */
    .quiz-section {
      flex: 1.2;
      background: var(--panel-bg);
      border-radius: var(--radius-lg);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #f1f5f9;
    }
    .badge { padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .badge-progress { background: var(--primary-light); color: var(--primary); }
    .badge-score { background: #dcfce7; color: #15803d; }

    .question-title { font-size: 1.35rem; font-weight: 600; color: #0f172a; margin-bottom: 1.5rem; line-height: 1.6; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.5rem; }
    
    .option-btn {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      background: white;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-main);
      text-align: left;
    }
    .option-btn:hover { border-color: #a5b4fc; background: #f8fafc; }
    .option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .option-btn.correct { border-color: var(--accent-green) !important; background: #ecfdf5 !important; color: #065f46 !important; font-weight: 600; }
    .option-btn.incorrect { border-color: var(--accent-red) !important; background: #fef2f2 !important; color: #991b1b !important; }

    .nav-btns { display: flex; gap: 12px; margin-top: auto; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f1f5f9; color: var(--text-muted); }
    .btn-secondary:hover { background: #e2e8f0; color: var(--text-main); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .result-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: var(--radius-md);
      font-weight: 600;
      text-align: center;
    }
    .result-box.correct { background: #dcfce7; color: #166534; }
    .result-box.incorrect { background: #fee2e2; color: #991b1b; }

    /* Chat Section */
    .chat-section {
      flex: 0.9;
      background: var(--panel-bg);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .chat-header {
      background: #1e293b;
      color: white;
      padding: 12px 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .message.user {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .message.assistant {
      background: #f1f5f9;
      color: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid #e2e8f0;
    }

    .quick-prompts {
      padding: 8px 12px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .chip {
      font-size: 0.8rem;
      background: white;
      border: 1px solid #cbd5e1;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

    .chat-input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #e2e8f0;
      background: white;
      gap: 8px;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md);
      outline: none;
    }
    .chat-input-area button {
      padding: 10px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <i class="fa-solid fa-square-root-variable"></i>
    <span>Calculus AI Workspace (Rock-a-Rhythm API)</span>
  </div>
</header>

<div class="container">
  <!-- โจทย์แบบฝึกหัด -->
  <div class="quiz-section">
    <div class="quiz-header">
      <span class="badge badge-progress" id="progress-text">ข้อ 1 / 20</span>
      <span class="badge badge-score" id="score-text">คะแนน: 0</span>
    </div>
    
    <div class="question-title" id="question-text">กำลังโหลดโจทย์...</div>
    <div class="options-grid" id="options-container"></div>
    
    <div class="nav-btns">
      <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" disabled>
        <i class="fa-solid fa-chevron-left"></i> ย้อนกลับ
      </button>
      <button class="btn btn-primary" id="submit-btn" onclick="checkAnswer()">
        ส่งคำตอบ
      </button>
      <button class="btn btn-secondary" id="next-btn" onclick="nextQuestion()">
        ถัดไป <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <div id="result-message"></div>
  </div>

  <!-- AI Assistant Chat -->
  <div class="chat-section">
    <div class="chat-header">
      <i class="fa-solid fa-robot"></i> AI Tutor Assistant (Rock-a-Rhythm Free API)
    </div>
    
    <div class="chat-messages" id="chat-messages">
      <div class="message assistant">สวัสดีครับ! ระบบเชื่อมต่อกับ Free LLM API เรียบร้อยแล้ว สามารถกดปุ่มขอคำใบ้ หรือพิมพ์ถามคำถามด้านล่างได้เลยครับโดยไม่ต้องใส่ Key ครับ</div>
    </div>

    <div class="quick-prompts">
      <button class="chip" onclick="sendQuickPrompt('ขอคำใบ้สำหรับข้อนี้หน่อย')">💡 ขอคำใบ้</button>
      <button class="chip" onclick="sendQuickPrompt('ทบทวนสูตรที่ต้องใช้ในข้อนี้ให้หน่อย')">📐 สูตรที่ต้องใช้</button>
      <button class="chip" onclick="askWhyWrong()">❓ ทำไมถึงผิด?</button>
    </div>

    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="พิมพ์คำถามที่นี่..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script>
  const quizData = [
    { q: "1. จงหาอนุพันธ์ของ $f(x) = 5x^3 - 2x^2 + 7x - 4$", options: ["$15x^2 - 4x + 7$", "$15x^3 - 4x + 7$", "$5x^2 - 4x + 7$", "$15x^2 - 4x$"], answer: 0 },
    { q: "2. จงหาค่าของ $\\frac{d}{dx}(x^4 \\cdot \\sin(x))$", options: ["$4x^3 \\sin(x)$", "$4x^3 \\cos(x)$", "$4x^3 \\sin(x) + x^4 \\cos(x)$", "$4x^3 \\cos(x) - x^4 \\sin(x)$"], answer: 2 },
    { q: "3. จงหาอนุพันธ์ของ $f(x) = \\frac{x^2 + 1}{x - 1}$", options: ["$\\frac{x^2 - 2x - 1}{(x-1)^2}$", "$\\frac{2x}{(x-1)^2}$", "$\\frac{x^2 + 2x - 1}{(x-1)^2}$", "$2x$"], answer: 0 },
    { q: "4. จงหาค่าของ $\\frac{d}{dx}(e^{3x^2})$", options: ["$e^{3x^2}$", "$6x e^{3x^2}$", "$3x e^{3x^2}$", "$6x e^{6x}$"], answer: 1 },
    { q: "5. จงหาอนุพันธ์ของ $f(x) = \\ln(x^3 + 2x)$", options: ["$\\frac{1}{x^3 + 2x}$", "$\\frac{3x^2 + 2}{x^3 + 2x}$", "$\\frac{3x^2 + 2}{x}$", "$3x^2 + 2$"], answer: 1 },
    { q: "6. จงหาค่าของ $\\frac{d}{dx}(\\cos(5x))$", options: ["$5 \\sin(5x)$", "$-5 \\sin(5x)$", "$-\\sin(5x)$", "$5 \\cos(5x)$"], answer: 1 },
    { q: "7. จงหาอนุพันธ์ของ $f(x) = (2x^2 + 3)^4$", options: ["$4(2x^2 + 3)^3$", "$16x(2x^2 + 3)^3$", "$8x(2x^2 + 3)^3$", "$16x^3$"], answer: 1 },
    { q: "8. จงหาค่าของ $\\frac{d}{dx}(\\tan(x))$", options: ["$\\sec^2(x)$", "$\\csc^2(x)$", "$-\\sec^2(x)$", "$\\cot(x)$"], answer: 0 },
    { q: "9. จงหาอนุพันธ์ของ $f(x) = \\sqrt{x}$", options: ["$\\frac{1}{\\sqrt{x}}$", "$\\frac{1}{2\\sqrt{x}}$", "$\\frac{-1}{2\\sqrt{x}}$", "$\\frac{2}{\\sqrt{x}}$"], answer: 1 },
    { q: "10. จงหาค่าของ $\\frac{d}{dx}(2^x)$", options: ["$x \\cdot 2^{x-1}$", "$2^x$", "$2^x \\ln(2)$", "$\\frac{2^x}{\\ln(2)}$"], answer: 2 },
    { q: "11. จงหาอนุพันธ์อันดับสองของ $f(x) = x^4 - 3x^2 + 2$", options: ["$4x^3 - 6x$", "$12x^2 - 6$", "$12x$", "$24x$"], answer: 1 },
    { q: "12. จงหาค่าของ $\\frac{d}{dx}(\\arcsin(x))$", options: ["$\\frac{1}{\\sqrt{1-x^2}}$", "$\\frac{1}{1+x^2}$", "$-\\frac{1}{\\sqrt{1-x^2}}$", "$\\frac{1}{1-x^2}$"], answer: 0 },
    { q: "13. จงหาอนุพันธ์ของ $f(x) = x \\cdot e^x$", options: ["$e^x$", "$x e^x$", "$e^x(x + 1)$", "$e^x(x - 1)$"], answer: 2 },
    { q: "14. จงหาค่าของ $\\frac{d}{dx}(\\ln(\\cos(x)))$", options: ["$-\\tan(x)$", "$\\tan(x)$", "$-\\cot(x)$", "$\\frac{1}{\\cos(x)}$"], answer: 0 },
    { q: "15. จงหาอนุพันธ์ของ $f(x) = \\frac{1}{x^2}$", options: ["$-\\frac{2}{x^3}$", "$\\frac{2}{x^3}$", "$-\\frac{1}{x}$", "$-\\frac{2}{x}$"], answer: 0 },
    { q: "16. จงหาความชันของเส้นสัมผัสโค้ง $y = x^2 - 3x + 2$ ที่จุด $x = 2$", options: ["0", "1", "2", "4"], answer: 1 },
    { q: "17. จงหาค่าของ $\\frac{d}{dx}(\\sec(x))$", options: ["$\\sec(x)\\tan(x)$", "$\\sec^2(x)$", "$-\\sec(x)\\tan(x)$", "$\\tan^2(x)$"], answer: 0 },
    { q: "18. จงหาอนุพันธ์ของ $f(x) = (x^3 + 1)^{1/2}$", options: ["$\\frac{3x^2}{2\\sqrt{x^3+1}}$", "$\\frac{1}{2\\sqrt{x^3+1}}$", "$\\frac{3x^2}{\\sqrt{x^3+1}}$", "$3x^2\\sqrt{x^3+1}$"], answer: 0 },
    { q: "19. ถ้า $f(x) = x^3$ จงหา $f'(3)$", options: ["9", "18", "27", "81"], answer: 2 },
    { q: "20. จงหาค่าของ $\\frac{d}{dx}(x \\ln(x) - x)$", options: ["$\\ln(x)$", "$\\ln(x) - 1$", "$\\frac{1}{x}$", "1"], answer: 0 }
  ];

  let currentQ = 0;
  let selectedOption = null;
  let userAnswers = new Array(quizData.length).fill(null);

  window.onload = () => { loadQuestion(); };

  function renderMath() {
    if (window.MathJax && window.MathJax.typesetPromise) {
      MathJax.typesetPromise().catch((err) => console.log(err));
    }
  }

  function loadQuestion() {
    const q = quizData[currentQ];
    document.getElementById("progress-text").innerText = `ข้อ ${currentQ + 1} / ${quizData.length}`;
    document.getElementById("question-text").innerText = q.q;
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";
    
    selectedOption = userAnswers[currentQ];

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      if (selectedOption === idx) btn.classList.add("selected");
      btn.innerHTML = `<span style="font-weight:bold; margin-right:8px;">${String.fromCharCode(65 + idx)}.</span> ${opt}`;
      btn.onclick = () => selectOption(idx);
      optionsContainer.appendChild(btn);
    });

    document.getElementById("result-message").className = "result-box";
    document.getElementById("result-message").innerText = "";

    document.getElementById("prev-btn").disabled = currentQ === 0;
    document.getElementById("next-btn").disabled = currentQ === quizData.length - 1;
    
    if (userAnswers[currentQ] !== null) showAnswerResult(userAnswers[currentQ]);
    renderMath();
  }

  function selectOption(idx) {
    selectedOption = idx;
    const btns = document.querySelectorAll(".option-btn");
    btns.forEach((btn, i) => btn.classList.toggle("selected", i === idx));
  }

  function checkAnswer() {
    if (selectedOption === null) return alert("กรุณาเลือกตัวเลือกก่อนส่งคำตอบครับ");
    userAnswers[currentQ] = selectedOption;
    calculateScore();
    showAnswerResult(selectedOption);
  }

  function showAnswerResult(userAns) {
    const q = quizData[currentQ];
    const btns = document.querySelectorAll(".option-btn");
    const resultBox = document.getElementById("result-message");

    btns.forEach((btn, idx) => {
      btn.classList.remove("selected", "correct", "incorrect");
      if (idx === q.answer) btn.classList.add("correct");
      if (idx === userAns && userAns !== q.answer) btn.classList.add("incorrect");
    });

    if (userAns === q.answer) {
      resultBox.className = "result-box correct";
      resultBox.innerText = "ถูกต้องครับ! 🎉";
    } else {
      resultBox.className = "result-box incorrect";
      resultBox.innerText = `ตอบผิดครับ (คุณเลือกข้อ ${String.fromCharCode(65 + userAns)}) สามารถถาม AI ด้านข้างเพิ่มเติมได้`;
    }
  }

  function calculateScore() {
    const score = userAnswers.reduce((acc, ans, idx) => ans === quizData[idx].answer ? acc + 1 : acc, 0);
    document.getElementById("score-text").innerText = `คะแนน: ${score}`;
  }

  function nextQuestion() { if (currentQ < quizData.length - 1) { currentQ++; loadQuestion(); } }
  function prevQuestion() { if (currentQ > 0) { currentQ--; loadQuestion(); } }

  /* Rock-a-Rhythm Free API Chat System */
  function handleKeyPress(e) { if (e.key === "Enter") sendMessage(); }
  function sendQuickPrompt(text) { document.getElementById("user-input").value = text; sendMessage(); }

  function askWhyWrong() {
    const userAns = userAnswers[currentQ];
    if (userAns === null) return alert("กรุณาเลือกและกดส่งคำตอบข้อนี้ก่อนครับ");
    const wrongText = quizData[currentQ].options[userAns];
    sendQuickPrompt(`ข้อนี้ผมเลือกตัวเลือก "${wrongText}" ทำไมถึงเป็นคำตอบที่ผิดครับ?`);
  }

  async function sendMessage() {
    const inputEl = document.getElementById("user-input");
    const text = inputEl.value.trim();
    if (!text) return;

    appendMessage("user", text);
    inputEl.value = "";

    const currentQuestionInfo = quizData[currentQ];
    const userAns = userAnswers[currentQ];
    const userAnsText = userAns !== null ? currentQuestionInfo.options[userAns] : "ยังไม่ได้ตอบ";

    const systemPrompt = `คุณคือ AI Tutor สอนวิชาแคลคูลัส
โจทย์ปัจจุบัน: "${currentQuestionInfo.q}"
ตัวเลือก: A: ${currentQuestionInfo.options[0]}, B: ${currentQuestionInfo.options[1]}, C: ${currentQuestionInfo.options[2]}, D: ${currentQuestionInfo.options[3]}
ผู้เรียนเลือกตอบ: ${userAnsText}

กฎ:
1. ห้ามเฉลยคำตอบตรงๆ
2. ให้เฉพาะคำใบ้หรือวิธีคิดสั้นๆ
3. เขียนสูตรในรูปแบบ LaTeX เช่น $f'(x) = 2x$
4. ตอบเป็นภาษาไทย กระชับ`;

    const loadingId = appendMessage("assistant", "กำลังประมวลผลผ่าน Rock-a-Rhythm API...");

    try {
      const response = await fetch("https://chat.rock-a-rhythm.net/api/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "qwen2.5",
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: text }
          ]
        })
      });

      const data = await response.json();
      if (data.choices && data.choices[0].message.content) {
        updateMessage(loadingId, data.choices[0].message.content);
      } else {
        updateMessage(loadingId, "⚠️ ไม่สามารถประมวลผลคำตอบจากเซิร์ฟเวอร์ได้");
      }
    } catch (err) {
      updateMessage(loadingId, "⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อกับ https://chat.rock-a-rhythm.net/");
    }
  }

  function appendMessage(role, text) {
    const chatMsgs = document.getElementById("chat-messages");
    const msgDiv = document.createElement("div");
    const id = "msg-" + Date.now();
    msgDiv.id = id;
    msgDiv.className = `message ${role}`;
    msgDiv.innerText = text;
    chatMsgs.appendChild(msgDiv);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
    renderMath();
    return id;
  }

  function updateMessage(id, text) {
    const msgDiv = document.getElementById(id);
    if (msgDiv) {
      msgDiv.innerText = text;
      const chatMsgs = document.getElementById("chat-messages");
      chatMsgs.scrollTop = chatMsgs.scrollHeight;
      renderMath();
    }
  }
</script>

</body>
</html>
